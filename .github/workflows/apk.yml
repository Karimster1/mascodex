name: apk
on: { push: { branches: [android] } }
permissions: { contents: read }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -eux
          PL=$ANDROID_HOME/platforms/android-35/android.jar
          BT=$ANDROID_HOME/build-tools/35.0.0
          mkdir -p o/c o/d
          $BT/aapt2 compile --dir res -o o/r.zip
          $BT/aapt2 link -I $PL --manifest AndroidManifest.xml --java o/gen -o o/u.apk o/r.zip
          javac -encoding UTF-8 --release 11 -cp $PL -d o/c $(find src o/gen -name '*.java')
          $BT/d8 --release --min-api 26 --lib $PL --output o/d $(find o/c -name '*.class')
          (cd o/d && zip -q ../u.apk classes.dex)
          $BT/zipalign -p 4 o/u.apk o/mascodex-sin-firma.apk
      - uses: actions/upload-artifact@v4
        with: { name: apk, path: o/mascodex-sin-firma.apk }
